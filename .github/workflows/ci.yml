# Tests for BMLT Minutes Archive Importer (with BMLT Minutes from wordpress.org, checksum pinned).
#
# Every push and pull request:
#   lint       WordPress security rules and PHP 8.0+ compatibility (phpcs), PHPStan, dependency audit, secret scan,
#              and the release build (versions agree, zip and checksums)
#   wordpress  the WordPress integration tests against the real BMLT Minutes: oldest supported WordPress on the
#              oldest supported PHP, latest WordPress on PHP 8.1-8.4, multisite, MySQL and MariaDB
#   e2e        the release zip on Apache and nginx with BMLT Minutes, real browser uploads in headless Chrome
# Tags: the zip built here gets a provenance attestation, and that is the zip that is published.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  WP_CLI_VERSION: 2.12.0

jobs:
  lint:
    name: Standards, static analysis, audit, secrets and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-progress --no-interaction
      - name: BMLT Minutes (for static analysis)
        run: bin/install-bmlt-minutes.sh
      - name: Coding standards (WordPress security rules, PHP 8.0+ compatibility)
        run: vendor/bin/phpcs -q
      - name: Static analysis (PHPStan level 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Known vulnerabilities in dependencies
        # Retried only when packagist cannot be reached (exit 100); findings fail at once.
        run: |
          for i in 1 2 3; do
            rc=0; composer audit || rc=$?
            [ $rc -ne 100 ] && exit $rc
            echo "packagist unreachable; retrying in 20 s"; sleep 20
          done
          exit 100
      - name: Secret scan (whole history)
        run: |
          V=8.21.2
          curl -fsSL --retry 5 -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSL --retry 5 -o /tmp/gitleaks.sums "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          (cd /tmp && grep "gitleaks_${V}_linux_x64.tar.gz" gitleaks.sums | sed 's#gitleaks_.*#gitleaks.tgz#' | sha256sum -c -)
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact .
      - name: Release build
        # Tags build the release; other pushes build a test zip of the same version, marked as a development build.
        run: bin/build.sh $([ "$GITHUB_REF_TYPE" = tag ] || echo --dev)
      - uses: actions/upload-artifact@v5
        with:
          name: bmlt-minutes-archive-importer-zip
          path: dist/bmlt-minutes-archive-importer-*.zip*
          retention-days: 30

  wordpress:
    name: WordPress ${{ matrix.wp }} (PHP ${{ matrix.php }}${{ matrix.multisite == '1' && ', multisite' || '' }}, ${{ matrix.db }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.0', wp: '6.0.11', multisite: '0', db: 'mysql:5.7' }
          - { php: '8.1', wp: 'latest', multisite: '0', db: 'mysql:8.0' }
          - { php: '8.2', wp: 'latest', multisite: '1', db: 'mysql:8.0' }
          - { php: '8.3', wp: 'latest', multisite: '0', db: 'mariadb:10.6' }
          - { php: '8.4', wp: 'latest', multisite: '1', db: 'mariadb:11.4' }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot || mariadb-admin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli, openssl
          coverage: none
      - run: composer install --no-progress --no-interaction
      - name: BMLT Minutes
        run: bin/install-bmlt-minutes.sh
      - name: WordPress and its test library
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} /tmp/wp-tests
      - name: Integration tests
        run: vendor/bin/phpunit -c tests/wordpress/phpunit.xml.dist
        env:
          WP_TESTS_DIR: /tmp/wp-tests/tests-lib
          WP_MULTISITE: ${{ matrix.multisite }}

  e2e:
    name: End to end (Apache and nginx, BMLT Minutes, browser uploads)
    needs: lint
    runs-on: ubuntu-24.04
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Apache, nginx and PHP-FPM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2 nginx php8.3-fpm php8.3-mysql >/dev/null
          sudo systemctl stop apache2 nginx php8.3-fpm || true
          /usr/sbin/php-fpm8.3 -m | grep -qi mysqli
      - name: Install WP-CLI
        run: |
          URL=https://github.com/wp-cli/wp-cli/releases/download/v$WP_CLI_VERSION/wp-cli-$WP_CLI_VERSION.phar
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/wp.phar "$URL"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/wp.sha512 "$URL.sha512"
          echo "$(cat /tmp/wp.sha512)  /tmp/wp.phar" | sha512sum -c -
          sudo install -m 755 /tmp/wp.phar /usr/local/bin/wp
      - uses: actions/download-artifact@v5
        with:
          name: bmlt-minutes-archive-importer-zip
          path: dist
      - name: BMLT Minutes
        run: bin/install-bmlt-minutes.sh
      - name: End-to-end test of the release zip
        run: bin/e2e.sh /tmp/e2e
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_ADMIN_USER: root
          DB_ADMIN_PASS: root
          APACHE: /usr/sbin/apache2
          APACHE_MODULES: /usr/lib/apache2/modules
          NGINX: /usr/sbin/nginx
          PHP_FPM: /usr/sbin/php-fpm8.3
          CHROME: google-chrome
          KEEP: '1'
      - name: Server logs
        if: failure()
        run: |
          for f in /tmp/e2e/logs/*; do echo "== $f"; tail -40 "$f"; done
        continue-on-error: true

  provenance:
    name: Release zip provenance (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, wordpress, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bmlt-minutes-archive-importer-zip
          path: dist
      - name: Checksums
        run: cd dist && sha256sum -c *.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/bmlt-minutes-archive-importer-*.zip
